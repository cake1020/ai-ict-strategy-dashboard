<!doctype html>
<html lang="ko">
<head>

  <title>AI·ICT Strategy Desk</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">

      <div class="brand">
        <div class="brand-mark">A<span>·</span>I</div>
        <div><strong>Strategy Desk</strong><small>AI · ICT 정책분석</small></div>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="overview"><span>◈</span> 전체 상황판</button>
        <button class="nav-item" data-view="domains"><span>◌</span> 기술분야 리포트</button>
        <button class="nav-item" data-view="strategy"><span>↗</span> 전략 업데이트</button>

      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="crumb"><span>AI·ICT 국가전략</span><b>/</b><strong id="view-label">전체 상황판</strong></div>

      <section class="content-wrap">

          <div>

          </div>
          <div class="head-meta"><span class="live-pill"><i></i> 기준일 2026.09.16</span><button class="primary-btn" id="new-priority">+ 우선순위 지정</button></div>
        </div>

        <div id="app-view"></div>
      </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
